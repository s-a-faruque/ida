<!doctype html>
<html lang="{{ .Site.LanguageCode }}">

<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-N8KPYHG8LB"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-N8KPYHG8LB');
  </script>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <!-- color of address bar in mobile browser -->
  <meta name="theme-color" content="#28292C">
  <!-- favicon  -->
  <link rel="shortcut icon" href="/img/favicon.ico" type="image/x-icon">
  <!-- bootstrap css -->
  <link rel="stylesheet" href="/css/plugins/bootstrap.min.css">
  <!-- font awesome css -->
  <script src="https://kit.fontawesome.com/0a2f6f41c6.js" crossorigin="anonymous"></script>
  <!-- swiper css -->
  <link rel="stylesheet" href="/css/plugins/swiper.min.css">
  <!-- fancybox css -->
  <link rel="stylesheet" href="/css/plugins/fancybox.min.css">
  <!-- mapbox css -->
  <link href="/css/plugins/mapbox-style.css" rel='stylesheet'>
  <!-- main css -->
  <link rel="stylesheet" href="/css/style.css">

  <title>{{ .Title }} | {{ .Site.Title }}</title>
</head>

<body>

  <div class="qrt-app">
    <div class="qrt-preloader">
      <div class="qrt-preloader-content">
        <div class="qrt-logo">
          <img src="/img/ida-logo.png" alt="IDA">
        </div>
        <div id="preloader" class="qrt-preloader-load"></div>
      </div>
    </div>
    <div id="cursor" class="qrt-cursor">
      <div></div>
      <div class="qrt-follower"><i class="fas fa-circle-notch"></i></div>
    </div>
    <div class="qrt-top-bar">
      <a href="/" class="qrt-symbol qrt-cursor-scale qrt-anima-link"><img src="/img/ida-logo.png" alt="IDA"></a>
      <a href="/" class="qrt-logo qrt-cursor-color qrt-cursor-scale qrt-anima-link">
        <img src="/img/ida-logo.png" alt="IDA">
      </a>

      <div class="qrt-menu">
        <div id="qrt-dynamic-menu" class="qrt-dynamic-menu">
          <nav>
            <ul>
              <li class="{{ if .IsHome }}current-menu-item{{ end }}">
                <a href="/">Home</a>
              </li>
              <li class="{{ if eq .Type "page" }}{{ if eq .Title "About" }}current-menu-item{{ end }}{{ end }}">
                <a href="/about-us/">About</a>
              </li>
              <li class="{{ if eq .Type "page" }}{{ if eq .Title "Portfolio" }}current-menu-item{{ end }}{{ end }}">
                <a href="/portfolio/">Portfolio</a>
              </li>
              <li class="{{ if eq .Type "page" }}{{ if eq .Title "Contact" }}current-menu-item{{ end }}{{ end }}">
                <a href="/contact/">Contact</a>
              </li>
            </ul>
          </nav>
        </div>
      </div>
      <div class="qrt-buttons">
        <div class="qrt-menu-btn qrt-cursor-color qrt-cursor-scale"><span></span></div>
        <div class="qrt-info-btn qrt-cursor-color qrt-cursor-scale"><span></span></div>
      </div>
      <div class="qrt-info" id="qrt-scroll-info">
        <div class="qrt-info-frame">
          <ul class="qrt-table">
            <li>
              <h5>Country</h5><span>Bangladesh</span>
            </li>
            <li>
              <h5>City</h5><span>Dhaka</span>
            </li>
            <li>
              <h5>Street</h5><span style="text-align: right;">70-71/ R-03, Janata housing. <br />Adabor. </span>
            </li>
            <li>
              <h5>Email</h5><span><a class="qrt-cursor-scale qrt-cursor-color" href="mailto:info.idabd@gmail.com" data-no-swup>info.idabd@gmail.com</a></span>
            </li>
            <li>
              <h5>Phone</h5><span><a class="qrt-cursor-scale qrt-cursor-color" href="#." data-no-swup>+880 1717-882506</a></span>
            </li>
          </ul>
          <div class="qrt-divider"></div>
          <div class="qrt-social-links">
            <div class="qrt-social-links">
              <h5 class="qrt-mb-40">We are social</h5>
              <ul class="qrt-social-list">
                <li><a href="https://facebook.com/ida.archbd" class="qrt-cursor-scale qrt-cursor-color"><i class="fab fa-facebook"></i></a></li>
                <li><a href="https://instagram.com/ida.in.depth.architecture" class="qrt-cursor-scale qrt-cursor-color"><i class="fab fa-instagram"></i></a></li>
              </ul>
            </div>
          </div>
          <div class="qrt-divider"></div>

          <div class="qrt-copy">
            <div>© 2025 IDA.<br>Design by:&#160; <a class="qrt-cursor-scale qrt-cursor-color" href="https://zakera.framer.website/" target="_blank">Zakera Wadud</a></div>
          </div>
        </div>
      </div>
    </div>
    <div class="qrt-left-bar">
      <div class="qrt-current-page-title"></div>

    </div>
    <div class="qrt-curtain"></div>
    <div id="qrt-dynamic-content" class="qrt-dynamic-content">
      <div class="qrt-content" id="qrt-scroll-content">
        {{ block "main" . }}{{ end }}
      </div>
    </div>
  </div>

  <!-- jquery js -->
  <script src="/js/plugins/jquery.min.js"></script>
  <!-- anime js -->
  <script src="/js/plugins/anime.min.js"></script>
  <!-- swiper js -->
  <script src="/js/plugins/swiper.min.js"></script>
  <!-- progressbar js -->
  <script src="/js/plugins/progressbar.min.js"></script>
  <!-- smooth scrollbar js -->
  <script src="/js/plugins/smooth-scrollbar.min.js"></script>
  <!-- overscroll js -->
  <script src="/js/plugins/overscroll.min.js"></script>
  <!-- isotope js -->
  <script src="/js/plugins/isotope.min.js"></script>
  <!-- fancybox js -->
  <script src="/js/plugins/fancybox.min.js"></script>
  <!-- swup js -->
  <script src="/js/plugins/swup.min.js"></script>
  <!-- mapbox js -->
  <script src="/js/plugins/mapbox.min.js"></script>

  <!-- main js -->
  <script src="/js/main.js"></script>

</body>

</html>
